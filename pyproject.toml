[project]
name = "mortemtrace"
version = "0.1.0"
description = "On-call incident agent fleet: one committed timeline, four departmental scopes enforced at the data layer."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7,<3",
    "google-adk>=2.7,<3",
    # Declared explicitly, not relied on transitively: data/scope_store.py
    # imports google.api_core.exceptions.AlreadyExists directly (the atomic
    # idempotency-marker create), as do infra/setup_model_armor.py and
    # tests/fakes.py. It happens to arrive as a dependency of the
    # google-cloud-* packages below, but importing a package you did not
    # declare means a resolver is free to hand you a tree without it.
    "google-api-core>=2.19,<3",
    "google-cloud-firestore>=2.19,<3",
    "google-cloud-pubsub>=2.23,<3",
    "google-cloud-aiplatform>=1.70,<2",
    "google-cloud-logging>=3.11,<4",
    "google-cloud-trace>=1.14,<2",
    "google-cloud-modelarmor>=0.7,<1",
    "opentelemetry-api>=1.27,<2",
    "opentelemetry-sdk>=1.27,<2",
    "opentelemetry-exporter-gcp-trace>=1.7,<2",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-multipart>=0.0.9",
    "jinja2>=3.1,<4",
    # OIDC client for human login (Google Sign-In, and any org's own
    # Entra ID/Okta/Auth0/etc.): discovery-document fetching, PKCE,
    # state/nonce handling, and JWKS-based ID-token signature
    # verification against a third party's rotating keys. This is real
    # cryptographic protocol surface, not something to hand-roll -
    # MortemTrace's own session cookie still reuses the existing
    # HMAC-SHA256 pattern from data/scope_store.sign_claim rather than
    # pulling in a second mechanism for that simpler, already-solved part.
    "authlib>=1.3,<2",
    # Declared explicitly for the same reason as google-api-core above:
    # auth/oidc.py calls it directly (discovery-document and JWKS
    # fetches) rather than relying on it arriving transitively via
    # Authlib or google-auth.
    "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "httpx>=0.27,<1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = [
    "agents*", "auth*", "connectors*", "gateway*", "data*", "registry*",
    "memory*", "telemetry*", "api*", "console*",
]

[tool.setuptools.package-data]
console = ["templates/*.html"]
# Connector presets are data, not code - shipping them is what makes
# "supported tool" a JSON file rather than a release.
connectors = ["presets/*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = [
    # Surfaced by the deprecated positional .where() calls that were
    # migrated to keyword filters; kept as an error so a regression is
    # caught rather than becoming background noise again.
    "ignore::DeprecationWarning:google.adk.*",
]

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = [".venv", "venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = [
    "E501",   # line length is enforced by the formatter, not the linter
    "B008",   # FastAPI's Depends/Header/Form defaults are call-in-default by design
    "UP007",  # Optional[X] is used consistently across the codebase
    "UP045",  # ditto - rewriting 98 sites to `X | None` is churn, not a fix
    "UP035",  # typing.Callable/Iterable still read fine and are used throughout
    "UP037",  # quoted annotations are needed for the self-referential fakes
]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use assert, hardcoded test tokens, and private access.
"tests/*" = ["S101", "S105", "S106", "S311"]
# The dev-fallback secret constant is deliberate and loudly warned about -
# same pattern in all three modules that sign short-lived values.
"data/scope_store.py" = ["S105"]
"auth/session.py" = ["S105"]
"auth/oidc.py" = ["S105"]
