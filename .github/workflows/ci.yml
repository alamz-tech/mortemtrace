# The repository previously had no CI at all: nothing ran the test suite
# before a deploy, so the pipeline could not prevent broken code reaching
# production because there was no pipeline.
#
# Every job here runs without GCP credentials by design. The suite uses an
# in-memory Firestore double and never calls Vertex AI, so CI stays fast,
# free, and safe to run on pull requests from forks.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keeps CI output human-readable instead of newline-delimited JSON.
  MORTEMTRACE_PLAIN_LOGS: "1"

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.11 is the deployment runtime (Dockerfile / Cloud Run) and the
          # version constraints.txt was generated on, so it is tested with
          # the exact pinned set that ships.
          - python-version: "3.11"
            pinned: true
          # 3.13 is what local development uses. It installs UNPINNED on
          # purpose: a lockfile is valid for the interpreter it was
          # generated against (wheel availability differs per version -
          # pinning a grpcio build with no cp311 wheel is exactly how an
          # earlier version of this file broke the container build), so
          # forcing 3.11 pins onto 3.13 would test a combination that is
          # never deployed. This job is a forward-compatibility signal.
          - python-version: "3.13"
            pinned: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (pinned)
        if: matrix.pinned
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -e ".[dev]"

      - name: Install (unpinned forward-compat check)
        if: ${{ !matrix.pinned }}
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -q --junitxml=junit.xml

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.python-version }}
          path: junit.xml

  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -e ".[dev]"
          pip install ruff==0.14.2 mypy==1.18.2

      - name: Ruff
        run: ruff check .

      - name: Mypy
        # Non-blocking: the codebase is not fully annotated, and gating on
        # a clean run today would mean either a wall of ignores or a
        # disabled check. Surfaced so the trend is visible and can be
        # tightened incrementally.
        run: mypy --ignore-missing-imports auth data agents gateway registry telemetry || true

  security:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -e "."
          pip install pip-audit==2.9.0 bandit==1.8.6

      - name: Dependency vulnerability audit
        # Advisory rather than blocking: a transitive CVE with no fixed
        # version available should not wedge every unrelated PR. Reviewed
        # via the job summary.
        run: pip-audit --strict --progress-spinner off || true

      - name: Static security scan
        run: bandit -q -r auth data agents gateway api console registry telemetry -ll

  docker:
    name: Container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t mortemtrace:ci .

      - name: Verify it does not run as root
        run: |
          user=$(docker run --rm --entrypoint sh mortemtrace:ci -c 'id -un')
          echo "container user: $user"
          test "$user" = "mortemtrace"

      - name: Verify both app modules import
        # Catches an import-time break in either service before deploy -
        # both are served from this one image via APP_MODULE.
        run: |
          for module in api.ingest console.ui; do
            docker run --rm -e MORTEMTRACE_PLAIN_LOGS=1 --entrypoint python \
              mortemtrace:ci -c "import importlib; importlib.import_module('${module}'); print('${module} ok')"
          done
